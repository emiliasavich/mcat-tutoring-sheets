<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCAT Study Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F4F6;
    --surface:#FFFFFF;
    --ink:#14202B;
    --ink-soft:#516170;
    --line:#DCE3E8;
    --display:'Space Grotesk',sans-serif;
    --body:'Newsreader',Georgia,serif;
    --mono:'JetBrains Mono',monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:48px 20px 80px;
  }

  .sheet{max-width:860px;margin:0 auto}
  
  .home-header{
    margin-bottom:50px;
  }
  
  .home-header h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(40px,8vw,68px);
    line-height:.98;
    letter-spacing:-.02em;
    margin-bottom:14px;
  }
  
  .home-header .subtitle{
    font-size:19px;
    color:var(--ink-soft);
    max-width:60ch;
  }
  
  .sheets-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:16px;
    margin-top:40px;
  }
  
  .sheet-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 24px;
    text-decoration:none;
    color:inherit;
    transition:all 0.2s ease;
    display:block;
  }
  
  .sheet-card:hover{
    border-color:var(--ink);
    box-shadow:0 8px 16px rgba(20,32,43,0.08);
    transform:translateY(-2px);
  }
  
  .sheet-card h2{
    font-family:var(--display);
    font-weight:600;
    font-size:22px;
    margin-bottom:10px;
    color:var(--ink);
  }
  
  .sheet-card .category{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  
  .sheet-card .description{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  
  .sheet-card .arrow{
    display:inline-block;
    margin-top:16px;
    font-family:var(--mono);
    font-weight:600;
    color:var(--ink-soft);
    font-size:14px;
  }
  
  .sheet-card:hover .arrow{
    color:var(--ink);
    transform:translateX(4px);
    display:inline-block;
    transition:all 0.2s ease;
  }
  
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  
  .empty-state p{
    font-size:16px;
  }

  @media (max-width:560px){
    body{font-size:16px;padding:32px 14px 60px}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="home-header">
    <h1>Study Sheets</h1>
    <p class="subtitle">A collection of comprehensive MCAT study guides organized by topic.</p>
  </div>
  
  <div class="sheets-list" id="sheetsList">
    <!-- Study sheets will be listed here in alphabetical order -->
  </div>
</div>

<script>
  // Define all study sheets here
  const studySheets = [
    {
      title: 'Glycolysis',
      category: 'Metabolism',
      description: 'The pathway that breaks down glucose into pyruvate, capturing energy along the way. Covers the investment phase, payoff phase, regulation, and fermentation.',
      url: 'glycolysis.html'
    }
    // Add more study sheets here in the future
  ];
  
  // Sort alphabetically by title
  studySheets.sort((a, b) => a.title.localeCompare(b.title));
  
  // Render the list
  const sheetsList = document.getElementById('sheetsList');
  
  if (studySheets.length === 0) {
    sheetsList.innerHTML = '<div class="empty-state"><p>More study sheets coming soon...</p></div>';
  } else {
    studySheets.forEach(sheet => {
      const card = document.createElement('a');
      card.href = sheet.url;
      card.className = 'sheet-card';
      card.innerHTML = `
        <div class="category">${sheet.category}</div>
        <h2>${sheet.title}</h2>
        <p class="description">${sheet.description}</p>
        <span class="arrow">→</span>
      `;
      sheetsList.appendChild(card);
    });
  }
</script>
</body>
</html>
